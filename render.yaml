services:
  - type: web
    name: enterprise-dashboard
    env: node
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-db
          property: connectionString
    autoDeploy: false
    healthCheckPath: /
    routes:
      - type: http
        path: /
        destination: /
      - type: http
        path: /api
        destination: /api

databases:
  - name: enterprise-db
    databaseName: enterprise_dashboard
    user: postgres
    plan: starter
